include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    todo: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_unnecessary_containers
    - avoid_web_libraries_in_flutter
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unnecessary_lambdas
    - unnecessary_null_checks
    - use_key_in_widget_constructors

# Enterprise rule: no TODO / FIXME / UnimplementedError permitted in shipped
# code. This is enforced by CI grep in build_and_deploy.yml, not just here,
# since the analyzer cannot fail the build on comment content alone.
