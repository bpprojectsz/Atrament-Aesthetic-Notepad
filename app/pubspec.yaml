name: parchment
description: A premium, distraction-free notepad with paper textures and daily ambient scripture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Rich text editor
  flutter_quill: ^9.3.20

  # Local persistence
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Export / sharing
  share_plus: ^9.0.0
  file_picker: ^8.0.3
  pdf: ^3.11.0
  screenshot: ^3.0.0

  # Monetization
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0

  # Security
  local_auth: ^2.2.0

  # Notifications
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4

  # Formatting / i18n
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/paper_textures/
    - assets/json/

  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
        - asset: assets/fonts/Merriweather-Italic.ttf
          style: italic

# flutter_native_splash configuration (Section 10)
flutter_native_splash:
  color: "#F5F1E8"
  image: assets/images/logo.png
  color_dark: "#1A1612"
  image_dark: assets/images/logo.png
  android_12:
    color: "#F5F1E8"
    image: assets/images/logo.png
    color_dark: "#1A1612"
    image_dark: assets/images/logo.png
