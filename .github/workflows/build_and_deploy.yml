name: Build and Deploy

on:
  workflow_dispatch:   # MANUAL ONLY — avoids burning free-tier CI minutes on every push

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Verify no debug artifacts shipped
        run: |
          if grep -rn "TODO\|FIXME" lib/ --include="*.dart"; then
            echo "::error::TODO/FIXME markers found in lib/ — not allowed in shipped code"
            exit 1
          fi
        working-directory: app

      - name: Analyze
        run: flutter analyze
        working-directory: app

      - name: Run tests
        run: flutter test
        working-directory: app

      - name: Build AAB (Play Store submission)
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols
        working-directory: app

      - name: Build APK (direct sideload testing)
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: atrament-android-aab
          path: app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: atrament-android-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: atrament-debug-symbols
          path: app/build/symbols/
          if-no-files-found: warn
