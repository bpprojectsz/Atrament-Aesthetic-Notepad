name: Compile Check

# MANUAL ONLY. Compiles and checks the code; never builds or uploads an APK/AAB,
# and needs no signing secrets. The "Build and Deploy" workflow is separate.
on:
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Lint and compile Dart (flutter analyze)
        run: flutter analyze
        working-directory: app

      - name: Unit and widget tests
        run: flutter test
        working-directory: app

      # gradlew is not committed (gitignored). `--config-only` runs Flutter's own
      # project migrations (e.g. minSdk bump), writes local.properties and creates
      # the Gradle wrapper, exactly as a real build would, but builds NO artifact.
      - name: Prepare Android project (config only, no build)
        run: flutter build apk --config-only
        working-directory: app

      - name: Compile Kotlin (no APK)
        run: |
          set +e
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace > "$RUNNER_TEMP/kotlin.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/kotlin.log"
          if [ "$code" -ne 0 ]; then
            # Surface the failure as annotations so it is readable without log access.
            key=$(grep -nE "What went wrong|^e: |error:|Could not |Execution failed|A problem occurred" -A6 "$RUNNER_TEMP/kotlin.log" | head -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            tail_=$(grep -vE '^[[:space:]]*$' "$RUNNER_TEMP/kotlin.log" | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::error title=Kotlin key lines::$key"
            echo "::error title=Kotlin log tail::$tail_"
          fi
          exit $code
        working-directory: app/android

      - name: Android lint (informational, non-blocking)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon
        working-directory: app/android
